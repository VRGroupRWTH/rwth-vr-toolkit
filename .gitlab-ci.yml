Deploy_General:
  rules: 
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "schedule"
  extends: .Deploy_General_
  needs:
    - job: Build_Windows
      artifacts: true
